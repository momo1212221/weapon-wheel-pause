name: EQS compatibility Windows test
on:
  push:
    branches: [eqs-compatibility]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: weapon-wheel-pause-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    if: github.ref == 'refs/heads/eqs-compatibility'
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install Ninja
        run: python -m pip install ninja
      - name: Configure MSVC environment
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { "$($matches[1])=$($matches[2])" | Out-File -Append $env:GITHUB_ENV }
          }
      - name: Download pinned OpenRAC SDK
        run: python tools/fetch_sdk.py
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Package platform archive
        run: |
          SDK=$(python tools/fetch_sdk.py)
          python "$SDK/tools/package_mod.py" build/package/weapon_wheel_pause -o dist
          ls -la dist
          # Check OpenRAC's platform filename and the contained library.
          VERSION=$(python -c 'import json; print(json.load(open("openrac-mod.json"))["version"])')
          ZIP="dist/weapon-wheel-pause-$VERSION-windows-x86_64.zip"
          test -s "$ZIP"
          python - "$ZIP" "windows-x86_64" <<'PY'
          import sys, zipfile
          archive, platform = sys.argv[1:]
          with zipfile.ZipFile(archive) as z:
              names = set(z.namelist())
              assert "openrac-mod.json" in names, names
              assert any(n.startswith(f"lib/{platform}/") and "weapon_wheel_pause" in n for n in names), names
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mod-windows-x86_64
          path: dist/*.zip
          if-no-files-found: error
